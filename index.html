<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-hearts"></div>

    <div class="container">
        <div class="proposal-card">
            <h1 class="title">Can i Invite you on Feb 17?</h1>
            <div class="gif-container">
                <img src="https://downloadwap.com/thumbs3/screensavers/d/new/animals/pretty_cat-87245.gif"
                    alt="Cute Cat" class="cute-gif">
            </div>
            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Yes, I will! 🥰</button>
                <button id="noBtn" class="btn no-btn">No 😢</button>
            </div>
        </div>

        <div id="successMessage" class="success-message hidden">
            <h1>Yay! I knew you'd say yes! ❤️</h1>
            <p>Can't wait to see you! Exciting</p>
            <img src="https://media.tenor.com/ger0WV_a2WMAAAAi/happy-cat.gif" alt="Happy Cat" class="success-gif">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
